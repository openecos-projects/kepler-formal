name: release

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '37 17 * * *'
  workflow_dispatch:
    inputs:
      suffix:
        description: >-
          Same-day nightly rerun suffix (integer >= 2), appended to the
          nightly tag as .<n>. Required when today's nightly tag already
          exists; published tags are never overwritten.
        required: false
        type: number

permissions:
  contents: write

# Stable tag pushes serialize per tag; nightly runs (scheduled or manual)
# share a single group so nightly publishes never interleave.
concurrency:
  group: ${{ github.event_name == 'push' && format('release-{0}', github.ref) || 'release-nightly' }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    # Stable releases are built from pushed v* tags. Nightly tags also match
    # the 'v*' trigger, so exclude them explicitly (on top of GitHub's
    # built-in GITHUB_TOKEN recursion guard) to keep nightly publishing from
    # re-entering the stable path.
    if: ${{ github.event_name != 'push' || !contains(github.ref_name, '-nightly.') }}

    steps:
    - uses: actions/checkout@v4

    - name: Compute release version and tag
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
        SUFFIX: ${{ github.event.inputs.suffix }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bash .github/scripts/compute-release-version.sh

    - name: Set up Bazelisk
      if: steps.version.outputs.skip != 'true'
      # Bazelisk is preinstalled on the runner image and honors
      # .bazelversion, like the bazel workflow.
      run: bazelisk version

    - name: Cache Bazel outputs
      if: steps.version.outputs.skip != 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/bazel
        key: bazel-release-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'bazel/deps.bzl', 'bazel/*.BUILD.bazel') }}
        restore-keys: |
          bazel-release-${{ runner.os }}-

    - name: Install system dependencies
      if: steps.version.outputs.skip != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -yq \
          build-essential pkg-config \
          bison flex python3-dev

    - name: Build (optimized)
      if: steps.version.outputs.skip != 'true'
      run: bazelisk build -c opt //src/bin:kepler-formal

    - name: Package
      if: steps.version.outputs.skip != 'true'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        DIST="kepler-formal-${VERSION}-linux-x86_64"
        mkdir -p "${DIST}/bin" "${DIST}/lib"

        # Copy the binary
        cp bazel-bin/src/bin/kepler-formal "${DIST}/bin/"
        cp bazel-bin/src/bin/naja.so "${DIST}/bin/"

        # Ship the top-level docs and optional local MCP package.
        cp README.md LICENSE.rst "${DIST}/"
        cp -R mcp "${DIST}/mcp"

        # Bundle the Naja shared runtime.
        find bazel-bin/ -name 'libnaja_*.so' -exec cp {} "${DIST}/lib/" \;
        if ! find "${DIST}/lib" -maxdepth 1 -name 'libnaja_*.so' | grep -q .; then
          echo "Expected bundled naja shared libraries were not found."
          exit 1
        fi

        # Bundle TBB (no static libs by design) from the hermetic Bazel
        # build — the exact libraries the binary and naja .so files link.
        for lib in libtbb.so.12 libtbbmalloc.so.2; do
          find -L bazel-bin/ -name "${lib}" -print -quit | xargs -I{} cp -L {} "${DIST}/lib/"
          test -f "${DIST}/lib/${lib}" || { echo "missing bundled ${lib}"; exit 1; }
        done

        # Create wrapper script that sets LD_LIBRARY_PATH for bundled libs
        printf '%s\n' \
          '#!/usr/bin/env bash' \
          'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' \
          'export LD_LIBRARY_PATH="${SCRIPT_DIR}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
          'exec "${SCRIPT_DIR}/bin/kepler-formal" "$@"' \
          > "${DIST}/kepler-formal"
        chmod +x "${DIST}/kepler-formal"

        tar czf "${DIST}.tar.gz" "${DIST}"
        sha256sum "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256"

    - name: Verify
      if: steps.version.outputs.skip != 'true'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        DIST="kepler-formal-${VERSION}-linux-x86_64"
        echo "=== ldd output ==="
        ldd "${DIST}/bin/kepler-formal"
        echo "=== hermetic toolchain checks ==="
        # libc++ is statically linked by the hermetic toolchain.
        if ldd "${DIST}/bin/kepler-formal" | grep -E "libstdc\+\+|libc\+\+"; then
          echo "unexpected dynamic C++ runtime dependency"; exit 1
        fi
        # glibc floor: hermetic toolchain targets 2.28 for portability.
        MAX_GLIBC=$(objdump -T "${DIST}/bin/kepler-formal" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
        echo "max glibc symbol: ${MAX_GLIBC}"
        printf '%s\n' "${MAX_GLIBC#GLIBC_}" 2.28 | sort -CV || { echo "glibc floor regressed above 2.28"; exit 1; }
        readelf -p .comment "${DIST}/bin/kepler-formal" | grep clang
        echo "=== smoke test ==="
        "./${DIST}/kepler-formal" --help || true
        "./${DIST}/kepler-formal" --version

    - name: Create GitHub Release
      if: steps.version.outputs.skip != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.version.outputs.tag }}
        VERSION: ${{ steps.version.outputs.version }}
        TITLE: ${{ steps.version.outputs.title }}
        NIGHTLY: ${{ steps.version.outputs.nightly }}
        PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
      run: |
        set -euo pipefail
        assets=(
          "kepler-formal-${VERSION}-linux-x86_64.tar.gz"
          "kepler-formal-${VERSION}-linux-x86_64.tar.gz.sha256"
        )
        if [ "${NIGHTLY}" != "true" ]; then
          gh release create "${TAG}" \
            --title "${TITLE}" \
            --generate-notes \
            "${assets[@]}"
          exit 0
        fi

        notes_file="$(mktemp)"
        {
          echo "Nightly build of kepler-formal from commit ${GITHUB_SHA}."
          echo
          if [ -n "${PREVIOUS_TAG}" ]; then
            echo "Changes since ${PREVIOUS_TAG}: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
            echo
          fi
          echo "This is an unstable nightly prerelease: it may change or be rebuilt at any time. Use the latest stable release for production."
        } > "${notes_file}"
        gh release create "${TAG}" \
          --target "${GITHUB_SHA}" \
          --prerelease \
          --title "${TITLE}" \
          --notes-file "${notes_file}" \
          "${assets[@]}"

    - name: Prune old nightly releases
      if: ${{ github.event_name != 'push' && steps.version.outputs.skip != 'true' }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        KEEP: ${{ vars.NIGHTLY_KEEP || '14' }}
      run: bash .github/scripts/prune-nightlies.sh
